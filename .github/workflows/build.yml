name: Build Atlas Releases

# Triggers automatically when you push a version tag, e.g.:
#   git tag v1.2.0
#   git push origin v1.2.0

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: Atlas-linux
          - os: windows-latest
            asset_name: Atlas-windows
          - os: macos-latest
            asset_name: Atlas-mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Free disk space
        if: matrix.os == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Linux/macOS can use the default checkout location.
      - name: Checkout code (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/checkout@v4

      # Windows: repo name ends in a period, which Windows silently strips
      # from folder names — this breaks GitHub's auto-generated
      # D:\a\<repo>\<repo> workspace path entirely. Checkout to an absolute,
      # repo-name-independent path instead so that broken folder is never
      # relied upon.
      - name: Checkout code (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/checkout@v4
        with:
          path: C:\atlas

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc portaudio19-dev libasound2-dev

      - name: Install macOS system dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install portaudio

      - name: Install Python dependencies (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-build.txt
          pip install pyinstaller

      - name: Install Python dependencies (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: C:\atlas
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-build.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          pyinstaller --onedir
          --add-data "config.yaml:."
          --add-data "modules/voices:modules/voices"
          --collect-all vispy
          --collect-all whisper
          --collect-all faster_whisper
          --collect-all uvicorn
          --collect-all PyQt5
          --collect-all sudachidict_core
          --collect-all gruut_lang_de
          --collect-all gruut_lang_es
          --collect-all gruut_lang_fr
          --collect-all piper
          main.py

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: C:\atlas
        run: >
          pyinstaller --onedir
          --add-data "config.yaml;."
          --add-data "modules/voices;modules/voices"
          --collect-all vispy
          --collect-all whisper
          --collect-all faster_whisper
          --collect-all uvicorn
          --collect-all PyQt5
          --collect-all sudachidict_core
          --collect-all gruut_lang_de
          --collect-all gruut_lang_es
          --collect-all gruut_lang_fr
          --collect-all piper
          main.py

      - name: Zip the build (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }}.zip main

      - name: Zip the build (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: C:\atlas
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/main/* `
            -DestinationPath "C:\atlas\${{ matrix.asset_name }}.zip"

      - name: Upload build artifact (Linux/Mac)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

      - name: Upload build artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: C:\atlas\${{ matrix.asset_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create/update GitHub Release with all builds attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Atlas-linux/Atlas-linux.zip
            Atlas-windows/Atlas-windows.zip
            Atlas-mac/Atlas-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}